name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Bun, not Node. The app imports `bun:sqlite` and loads OpenTUI's native
      # library through Bun's FFI, so a Node matrix could never actually run
      # it — the old 18/20/22 jobs only ever typechecked and then failed on a
      # missing package-lock.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      # Installs from bun.lock, which is the lockfile this repo actually has.
      - run: bun install --frozen-lockfile

      # Typecheck without emitting. `tsc` output isn't usable at runtime
      # (dist/ keeps the Bun-only `bun:sqlite` import), so the type errors are
      # the useful signal, not the artifacts.
      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun run test
